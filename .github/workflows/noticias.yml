
name: Actualizar noticias Fribo433

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener noticias de futbol
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import html
          import re
          import os

          feeds = [
              ("BBC Sport", "https://feeds.bbci.co.uk/sport/football/rss.xml"),
              ("The Guardian", "https://www.theguardian.com/football/rss"),
          ]

          noticias = []
          vistos = set()

          for fuente, url in feeds:
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Fribo433/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as respuesta:
                      raiz = ET.fromstring(respuesta.read())

                  for item in raiz.findall(".//item"):
                      titulo = item.findtext("title", "").strip()
                      enlace = item.findtext("link", "").strip()

                      if not titulo or not enlace:
                          continue
                      if not enlace.startswith("https://"):
                          continue
                      if titulo.lower() in vistos:
                          continue

                      vistos.add(titulo.lower())
                      noticias.append((titulo, enlace, fuente))

              except Exception as error:
                  print(f"Fuente no disponible: {fuente}: {error}")

          if not noticias:
              raise SystemExit("No se obtuvieron noticias; no se modifica la web.")

          noticias = noticias[:10]
          archivo = "index.html"

          with open(archivo, encoding="utf-8") as f:
              contenido_html = f.read()

          inicio = '<div id="noticias-auto">'
          fin = '</div><!-- FIN-NOTICIAS-AUTO -->'

          if inicio not in contenido_html or fin not in contenido_html:
              raise SystemExit("Faltan los marcadores en index.html.")

          tarjetas = [inicio]

          for titulo, enlace, fuente in noticias:
              t = html.escape(titulo)
              u = html.escape(enlace, quote=True)
              f = html.escape(fuente)

              tarjetas.append(
                  '<article class="card"><div class="cardbody">'
                  f'<div class="tag">{f}</div>'
                  f'<h3><a href="{u}" target="_blank" '
                  f'rel="noopener noreferrer">{t}</a></h3>'
                  f'<p>Titular de {f}. Consulta la noticia original '
                  f'en su medio.</p></div></article>'
              )

          tarjetas.append(fin)
          bloque = "\n".join(tarjetas)

          patron = re.escape(inicio) + r".*?" + re.escape(fin)
          nuevo_html, cambios = re.subn(
              patron, lambda _: bloque, contenido_html, count=1, flags=re.S
          )

          if cambios != 1:
              raise SystemExit("No se pudo actualizar el bloque de noticias.")

          with open(archivo, "w", encoding="utf-8") as f:
              f.write(nuevo_html)

          print(f"Noticias actualizadas: {len(noticias)}")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "Fribo433 Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Actualizar noticias automaticamente"
          git push

